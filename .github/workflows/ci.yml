name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run ts:check
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com/api
          VITE_SITE_URL: https://example.com

  api:
    name: API (prisma, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      JWT_SECRET: ci-access-secret-ci-access-secret-1234
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-5678
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: Ci-Admin-Password-123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: node --check scripts/verify-prod.js
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
